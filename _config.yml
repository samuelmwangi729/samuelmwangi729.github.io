theme: jekyll-theme-chirpy
lang: en
timezone: Africa/Nairobi

# --- SEO & Site Information ---
title: "Samuel Mwangi"
tagline: "High School Teacher | Software Developer | Cybersecurity Enthusiast"
description: >-
  I'm a High School Teacher specializing in Computer Science and Mathematics, 
  and a passionate Freelance Software Developer with 5+ years of experience in Cybersecurity. 
  Currently focusing on MERN stack development, cloud computing, and AI.

url: "https://samuelmwangi729.github.io"
baseurl: ""

# --- GitHub & Socials ---
github:
  username: samuelmwangi729

twitter:
  username: samuel_mwangi

social:
  name: Samuel Mwangi
  email: bh4534927@gmail.com
  links:
    - https://twitter.com/samuel_mwangi
    - https://github.com/samuelmwangi729
    - https://www.linkedin.com/in/samuel-mwangi

# --- Webmaster Verification (optional) ---
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# --- Analytics (optional, can add later) ---
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

pageviews:
  provider:

# --- Appearance ---
theme_mode: dark
cdn:
avatar: "/assets/img/avatar.png"
social_preview_image: "/assets/img/social-preview.png"
toc: true

# --- Comments (optional setup later) ---
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:

# --- PWA Settings ---
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths: []

paginate: 10

# --- Markdown & Code Settings ---
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    block:
      line_numbers: true
      start_line: 1

# --- Collections ---
collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
